# Build — Windows & macOS
#
# Artifacts: .msi / NSIS (Windows), .dmg / .app (macOS) when bundling succeeds.
# Signing / notarization / updater keys are optional — see docs/MACOS_BUILD.md.

name: build

on:
  push:
    branches: [master, main, release]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: windows
          - platform: macos-latest
            artifact_name: macos

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Download FFmpeg sidecar
        run: npm run download-ffmpeg

      - name: Rust unit tests
        run: npm run test:rust

      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            npm run tauri build -- --config src-tauri/tauri.conf.ci.json
          else
            npm run tauri build
          fi

      - name: Upload bundle artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aero-tandem-studio-${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/msi
            src-tauri/target/release/bundle/nsis
            src-tauri/target/release/bundle/dmg
            src-tauri/target/release/bundle/macos
          if-no-files-found: warn
          retention-days: 14
