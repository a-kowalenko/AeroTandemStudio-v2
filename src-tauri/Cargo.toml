[package]
name = "aero-tandem-studio"
version = "0.3.6"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aero_tandem_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
thiserror = "2.0.19"
regex = "1.13.1"
once_cell = "1.21.4"
http = "1"
http-range = "0.1"
percent-encoding = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
directories = "6.0.0"
rxing = { version = "0.9", default-features = false, features = ["image", "image_formats", "decoders", "qrcode", "encoding_rs"] }
image = "0.25"
jpeg-decoder = "0.3"
tempfile = "3.27.0"
sha1 = "0.10"
base64 = "0.22"
kamadak-exif = "0.6"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
smb2 = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["macros", "time", "rt", "sync"] }
mdns-sd = "0.15"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
url = "2"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_PortableDevices",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

